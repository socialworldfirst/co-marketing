t track."]], ["EEA", "logistics", "DSers", [4, 7, 8, 7, 8, 7], ["The alternative to CJ. Same rule: only one of the two ever runs."]], ["EEA", "network", "Allianz", [10, 5, 3, 3, 3, 1], ["The moonshot. Trade-insurance overlap, and a competitor already shows security by Allianz on its payment UI.", "Product integration is dead this year. Marketing-level co-acquisition is the live route, through Ant group ties on the Shanghai line.", "Do not commit production against this. It is an exploration."]], ["EEA", "client", "DE / NL operator sourcing from China", [3, 9, 7, 9, 8, 7], ["Local language is mandatory. The cluster is explicit that the story has to be told in German or Dutch.", "The Netherlands 21% VAT question is the tell that an operator is at the migration decision.", "Danny to source as the new EU manager."]], ["SG", "client", "T0 / T1 regional trader", [4, 10, 6, 10, 9, 7], ["Sylvia's named directive for SG. This lane needs no partner logo, just strong clients.", "Shows FX hedging through Forwards and SEA corridor collections.", "Joshua owes 2 to 3 names. This is the live ask."]], ["SG", "platform", "Meta", [10, 7, 6, 4, 3, 8], ["Joshua's first preference for the SEA cluster. Relationship is warm, no deal is signed.", "The door is his to open. His words: leaning on Meta is good for us.", "Product proof is the weak input: a platform partnership does not show a WF product doing work."]], ["SG", "network", "Mastercard", [10, 6, 7, 7, 4, 9], ["Collab locked, film track already moving.", "Joshua ranks it second for the cluster, behind Meta."]], ["SG", "client", "Business-coach community operator", [4, 9, 8, 8, 7, 7], ["The community is the distribution, which is what lifts the publish score.", "Cluster example is the Josh Chan type, an e-commerce operator with a US$20M exit.", "Audience is business owners and CFOs, not a young consumer audience."]], ["SG", "platform", "Grab", [8, 5, 5, 4, 3, 6], ["Joshua made the enterprise introduction, so the door exists.", "ICP overlap is the weak point. Name the product a viewer would open an account for before proceeding."]], ["MY", "marketplace", "1688", [8, 10, 7, 9, 10, 9], ["Collab locked, and Sylvia routes the whole 1688 story through Malaysia.", "Product hero is \u8de8\u5883\u5b9d (1688 World Pay) at 0.8%, with multi-currency and logistics unlocked."]], ["MY", "client", "\u8de8\u5883\u5b9d customer on camera", [3, 10, 7, 10, 10, 8], ["This is the actual asset Sylvia asked for: the 1688 content should centre on MY customers talking \u8de8\u5883\u5b9d.", "Three sub-personas do not merge: T3/T4 1688 importers, Malaysian-Chinese marketplace sellers, and Malay-community SMEs in Bahasa.", "Aria proposes the route."]], ["MY", "platform", "TikTok Shop", [9, 9, 6, 7, 8, 7], ["Second to 1688, and possibly one story with it: source on 1688, sell on TikTok Shop."]], ["MY", "association", "Chamber of commerce / trade association", [6, 7, 8, 5, 6, 5], ["Sylvia asked specifically to scan Malaysia's influential chambers and associations.", "Institutional trust travels well in this market, which is what lifts the publish score."]], ["MY", "client", "Cikgu Sam and similar educators", [5, 9, 9, 6, 9, 7], ["Best product fit on the MY KOL list: 1688, Canton Fair and OEM content.", "873K followers but roughly 3K median views. Price on last-10-post median, never on follower count.", "Treat as a referral partnership, not a booking."]], ["VN", "client", "Shopify seller collecting through Stripe", [3, 10, 7, 9, 4, 8], ["The priority audience, not a secondary one: Shopify and Stripe are 42% of NFC and roughly 52% of TPV.", "Corridor fit is low because the money flows in, not out to China. That is honest, not a problem to hide."]], ["VN", "client", "Freelancer as micro-influencer", [2, 7, 9, 8, 2, 9], ["A deliberately scoped VN-first test. It sits outside the SME core audience.", "Works on real numbers against PayPal, Pioneer and PingPong. Authentic beats polished here.", "Not a flagship film. This is volume of real-user proof."]], ["VN", "platform", "TikTok", [9, 8, 5, 5, 4, 6], ["The hottest channel in Vietnam, with CPM around US$6, which is efficient by global standards."]], ["VN", "platform", "Meta", [10, 7, 5, 4, 3, 6], ["Cluster-level platform preference sits with Joshua, not with VN. Coordinate before opening a separate door."]], ["TH", "association", "Deloitte", [10, 6, 9, 4, 5, 6], ["Proven in this market. The Deloitte and WorldFirst Thailand report reached 11,934 impressions, one of our top five organic posts ever.", "Institutional routes travel in TH where product claims currently cannot.", "Product proof is capped by the product gate, not by the partner."]], ["TH", "client", "Thai marketplace seller (Lazada / Shopee / TikTok)", [3, 9, 6, 5, 8, 6], ["Product proof is capped: pay to a Chinese bank account is not live in Thailand.", "Education-led content in Thai only. The region carries a hold-scale flag until the product unlocks."]], ["TH", "marketplace", "Lazada / Shopee", [9, 9, 4, 5, 7, 4], ["High ICP overlap and real brand weight, but low willingness to co-publish.", "Same product gate applies to anything filmed here."]], ["TH", "client", "Chinese-UBO importer", [3, 8, 2, 7, 10, 3], ["Roughly 40% of TH volume, but the cluster is explicit that this is a KA team pitch and not a social audience.", "Do not cast for content. Listed here so the name stops being re-proposed."]], ["US", "marketplace", "Walmart", [10, 9, 3, 6, 8, 3], ["Sylvia's directive: get the Walmart film right, maybe carrying a China Desk story inside it.", "The H2 Walmart Summit is the timing peg. Schedule the film to that moment.", "Steven asks James first on relationship. Sylvia escalates to Max only if it stalls."]], ["US", "client", "China Desk story", [4, 9, 5, 7, 10, 6], ["Asymmetric voice is mandatory: loud in Chinese, quiet and compliance-forward in English.", "Never write FDIC insured. Funds are held at FDIC-member banks, separate from company funds.", "Zyla is an affiliate, never a subsidiary. Ask before loudly connecting Ant, Zyla and the US."]], ["US", "client", "Large CN cross-border seller into US retail", [4, 9, 6, 8, 10, 6], ["Consent is the entire asset. Showing a retailer contact or a large seller without clearance burns access permanently.", "Positioning is access, not advice. The audience is deliberately whales only."]], ["US", "marketplace", "Costco / Home Depot", [9, 7, 2, 5, 7, 2], ["Access exists through James, who is in these rooms in Los Angeles.", "Co-publishing is very unlikely, which is what the score is telling you. Plan our own distribution or do not start."]]], REGS=[["UK", "United Kingdom"], ["EEA", "EU / EEA"], ["SG", "Singapore"], ["MY", "Malaysia"], ["VN", "Vietnam"], ["TH", "Thailand"], ["US", "United States, China Desk"]], CATS=[["marketplace", "Marketplace"], ["platform", "Platform"], ["network", "Network"], ["logistics", "Logistics"], ["association", "Institution"], ["client", "Client / ICP"]], DIMS=["Brand value", "ICP overlap", "Will they publish", "Product proof", "Corridor fit", "Speed to yes"], PRESETS=[["brand", "Brand-led", [35, 20, 15, 15, 10, 5]], ["bal", "Balanced", [25, 20, 20, 20, 10, 5]], ["exec", "Execution-led", [15, 20, 25, 20, 10, 10]]];
let sR='SG', sC=null, sN=null, sW='brand';
function wts(){return PRESETS.find(p=>p[0]===sW)[2];}
function score(d){const w=wts();let t=0;for(let i=0;i<6;i++)t+=d[i]/10*w[i];return t;}
function band(s){if(s>=78)return['Lead with it','Strong enough to carry a flagship film and open doors elsewhere. Commit production.'];
 if(s>=62)return['Build it, close one gap','Worth doing, but one input is dragging. Name the gap before briefing.'];
 if(s>=46)return['Sponsor and a date','Only proceed with a named internal sponsor and a fixed date.'];
 return['Park it','Park, and write down what would have to change.'];}
function pill(l,on,fn,tgt){const b=document.createElement('button');b.className='opt'+(on?' on':'')+(tgt?' tgt':'');b.type='button';b.textContent=l;b.onclick=fn;return b;}
function draw(){
 const R=document.getElementById('s-reg');R.innerHTML='';
 REGS.forEach(r=>R.appendChild(pill(r[0],sR===r[0],()=>{sR=r[0];sC=null;sN=null;draw();})));
 const has=c=>CAND.some(x=>x[0]===sR&&x[1]===c);
 const C=document.getElementById('s-cat');C.innerHTML='';
 CATS.forEach(c=>{if(has(c[0]))C.appendChild(pill(c[1],sC===c[0],()=>{sC=c[0];sN=null;draw();}));});
 const list=CAND.filter(x=>x[0]===sR&&(!sC||x[1]===sC));
 const N=document.getElementById('s-can');N.innerHTML='';
 list.forEach(x=>N.appendChild(pill(x[2],sN===x[2],()=>{sN=x[2];draw();},true)));
 document.getElementById('s-none').hidden=list.length>0;
 const W=document.getElementById('s-wt');W.innerHTML='';
 PRESETS.forEach(p=>W.appendChild(pill(p[1],sW===p[0],()=>{sW=p[0];draw();})));
 const cur=CAND.find(x=>x[0]===sR&&x[2]===sN);
 const val=document.getElementById('s-val'),bar=document.getElementById('s-bar'),
       ver=document.getElementById('s-ver'),brk=document.getElementById('s-brk'),flg=document.getElementById('s-flg');
 if(!cur){val.innerHTML='0<span class="so">/100</span>';bar.style.width='0%';
  ver.innerHTML='<b>Pick a candidate</b>Choose a region and category to score a name.';
  brk.innerHTML='';flg.innerHTML='';}
 else{const s=Math.round(score(cur[3])),bd=band(s),w=wts();
  val.innerHTML=s+'<span class="so">/100</span>';bar.style.width=s+'%';
  ver.innerHTML='<b>'+bd[0]+'</b>'+bd[1];
  brk.innerHTML=DIMS.map((d,i)=>'<div class="brow"><span class="bn">'+d+'</span><span class="bb"><i style="width:'+(cur[3][i]*10)+'%"></i></span><span class="bp">'+cur[3][i]+'/10</span></div>').join('')
   +'<div class="brow"><span class="bn" style="color:#9aa1a1">Weighting</span><span class="bp" style="width:auto;color:#9aa1a1">'+w.join(' / ')+'</span></div>';
  flg.innerHTML=cur[4].map(f=>'<div class="flag">'+f+'</div>').join('');}
 const rk=document.getElementById('s-rank');
 const rows=CAND.filter(x=>x[0]===sR).map(x=>[Math.round(score(x[3])),x]).sort((a,b)=>b[0]-a[0]);
 const rn=REGS.find(r=>r[0]===sR)[1];
 rk.innerHTML='<div class="tr th"><span>'+rn+'</span><span>Fit</span><span>Category and leading caveat</span></div>'
  +rows.map(r=>'<div class="tr rk"><span>'+r[1][2]+'</span><span class="sc">'+r[0]+'</span><span><span class="fx">'
   +CATS.find(c=>c[0]===r[1][1])[1]+'.</span> '+r[1][4][0]+'</span></div>').join('');
 Array.from(rk.querySelectorAll('.tr.rk')).forEach((el,i)=>{el.onclick=()=>{sN=rows[i][1][2];sC=null;draw();
   document.getElementById('sel').scrollIntoView({behavior:'smooth'});};});
}
function initSel(){draw();}

function b64b(s){const bin=atob(s);const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return b;}
async function mtDecrypt(pw){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64b(MT_BLOB.salt),iterations:MT_BLOB.iterations,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64b(MT_BLOB.iv)},key,b64b(MT_BLOB.ciphertext));
  return new TextDecoder().decode(pt);
}
function mtReveal(h){
  const stage=document.getElementById('mt-stage');
  if(!stage.dataset.filled){stage.innerHTML=h;stage.dataset.filled='1';}
  document.getElementById('mt-gate').style.display='none';
  document.getElementById('mt-doc').classList.add('on');
  if(mtBound)return; mtBound=true;
  if(typeof initSel==='function'){try{initSel();}catch(e){}}
  const links=Array.prototype.slice.call(document.querySelectorAll('nav.side a[data-s]'));
  const secs=links.map(function(a){return document.getElementById(a.dataset.s);}).filter(Boolean);
  function spy(){
    let cur=0;
    secs.forEach(function(s,i){if(s.getBoundingClientRect().top<=140)cur=i;});
    links.forEach(function(a,i){a.classList.toggle('on',i===cur);});
  }
  window.addEventListener('scroll',spy,{passive:true});
  spy();
}
async function mtTry(pw,silent){
  const err=document.getElementById('mt-err');
  try{const h=await mtDecrypt(pw);try{localStorage.setItem(MT_LS,pw);}catch(e){}mtReveal(h);}
  catch(e){if(!silent){err.textContent='wrong password';err.hidden=false;}try{localStorage.removeItem(MT_LS);}catch(e2){}}
}
document.getElementById('mt-form').addEventListener('submit',function(e){e.preventDefault();mtTry(document.getElementById('mt-pw').value,false);});
document.addEventListener('click',function(e){if(e.target&&e.target.id==='mt-lock'){e.preventDefault();try{localStorage.removeItem(MT_LS);}catch(err){}location.reload();}});
(function(){let s=null;try{s=localStorage.getItem(MT_LS);}catch(e){}if(s)mtTry(s,true);else document.getElementById('mt-pw').focus();})();
</script>

const REGS=[["UK", "United Kingdom", "ICP 2 marketplace sellers via Amazon, and ICP 1 lifestyle brand owners. Neil owns, with Scarlett and Kyle at ENMA above."], ["EEA", "EU / EEA", "German and Dutch operators, told in local language. Danny sources. The duty and VAT changes are the timing peg."], ["SG", "Singapore", "T0/T1 regional traders on FX hedging and SEA corridor collections. Josh and Shawn carry it."], ["MY", "Malaysia", "Four sub-personas that do not merge. Gated on KYC and onboarding conversion, not acquisition. Aria proposes the route."], ["VN", "Vietnam", "Shopify, POD and dropshipping: 42% of NFC and roughly 52% of TPV. Thao leads."], ["TH", "Thailand", "Pay to a Chinese bank account is not live, so most of the range cannot be ticked here. Education only. Iris Teo leads."], ["US", "United States, China Desk", "China Desk only. Loud in Chinese, compliance-forward in English. Consent is the whole asset. James first."]], FIELDS=[["brand", "Brand value", "how far the name travels", 35, "one", [["Category leader, recognised well beyond its own customers", 10], ["Well known inside its trade or category", 7], ["Known inside a community, association or coach network", 5], ["Known only to its own customers", 2]]], ["icp", "ICP overlap", "tick everything true", 30, "many", [["Imports from China", 3], ["Sources on 1688", 2], ["Owns their own brand", 2], ["Sells on Amazon", 2], ["Sells on TikTok Shop", 2], ["Sells on Lazada or Shopee", 2], ["Sells on Shopify or their own site", 2], ["Wholesale or trading business", 2], ["Has a team, not a solo operator", 2], ["Exports cross-border", 1], ["Runs Meta or Google ads at scale", 1]]], ["proof", "Product proof", "tick what they use with us", 25, "many", [["FX hedging or Forwards", 4], ["Pay to China", 3], ["1688 World Pay (\u8de8\u5883\u5b9d)", 3], ["Multi-currency collection / World Account", 2], ["Marketplace collection", 2], ["World Card", 2], ["Capital or funding", 2], ["Payouts to suppliers or contractors", 1], ["Local currency accounts", 1]]], ["relation", "Relationship", "where we are today", 10, "one", [["Already a public reference, has said yes before", 10], ["Warm, named contact, sales relationship is good", 8], ["Account exists, no marketing relationship", 5], ["Identified, not yet approached", 2]]]], PRESETS=[["brand", "Brand-led", [35, 30, 25, 10]], ["bal", "Balanced", [25, 30, 30, 15]], ["proof", "Proof-led", [20, 30, 40, 10]]], EGS=[["Lifestyle brand owner as ambassador", "UK", 1, [0, 2, 3, 6, 8], [1, 3, 4, 5], 1, "Recognisable name, deep ICP, warm relationship. The strongest combination on this model and the ambassador lane Sylvia asked for."], ["T0/T1 regional trader on FX hedging", "SG", 1, [0, 7, 8, 9], [0, 1, 3], 2, "Sylvia's named SG brief. FX hedging is the deepest product proof we can film, because only a real treasury user can tell it."], ["Chinese seller re-flagging into US retail", "US", 2, [0, 2, 7, 8, 9], [1, 3, 6, 7], 2, "Persona C, US only. Strong on every axis, but consent and the compliance rules decide whether it can be filmed at all."], ["Marketplace seller found through Amazon", "UK", 2, [0, 3, 8], [1, 3, 4], 2, "ICP 2, the lane Amazon opens. Works as peer proof rather than as a borrowed name, which is fine at this brand level."], ["\u8de8\u5883\u5b9d customer on camera", "MY", 3, [0, 1, 4, 8], [1, 2, 3], 2, "The asset Sylvia asked for. Brand value is the whole gap: it climbs to the mid sixties under Proof-led, which is the argument for keeping 1688 in frame alongside them."], ["Thai marketplace seller", "TH", 3, [0, 1, 5, 8], [2], 2, "Good ICP, almost nothing to show. Most of the range is not live in Thailand, so the fix is a product date, not better casting."], ["VN Shopify seller collecting through Stripe", "VN", 3, [6, 8, 9, 10], [3, 5, 7], 2, "Commercially the priority audience, weak as a co-marketing subject: no name to borrow and little product depth to film."]];
let sR='SG', sW='brand', pick={};
FIELDS.forEach(f=>{if(f[4]==='many')pick[f[0]]=[];else pick[f[0]]=null;});
function wts(){return PRESETS.find(p=>p[0]===sW)[2];}
function raw(f){
 const v=pick[f[0]];
 if(f[4]==='many'){if(!v||!v.length)return null;
  let t=0;v.forEach(i=>t+=f[5][i][1]);return Math.min(10,t);}
 return v==null?null:f[5][v][1];
}
function score(){const w=wts();let t=0;
 for(let i=0;i<FIELDS.length;i++){const r=raw(FIELDS[i]);if(r==null)return null;t+=r/10*w[i];}
 return t;}
function band(s){if(s>=78)return['Lead with it','Strong enough to carry a flagship film. Commit production.'];
 if(s>=62)return['Build it, close one gap','Worth doing, but one input is dragging. Name the gap in the brief.'];
 if(s>=46)return['Sponsor and a date','Only proceed with a named internal sponsor and a fixed date.'];
 return['Park it','Park, and write down what would have to change.'];}

 FIELDS.forEach(f=>{

  const o=document.createElement('div');o.className='opts';
  f[5].forEach((opt,i)=>{
   const on=many?pick[f[0]].indexOf(i)>-1:pick[f[0]]===i;

    if(many){const a=pick[f[0]],j=a.indexOf(i);if(j>-1)a.splice(j,1);else a.push(i);}
    else pick[f[0]]=i;
    draw();}));});
  d.appendChild(o);
  if(many){const r=raw(f);const h=document.createElement('div');h.className='fh';
   h.textContent=r==null?'Nothing ticked yet.':(pick[f[0]].length+' ticked, scoring '+r+' of 10'+(r===10?', capped':''));
   d.appendChild(h);}
  F.appendChild(d);});
 const W=document.getElementById('s-wt');W.innerHTML='';
 PRESETS.forEach(p=>W.appendChild(pill(p[1],sW===p[0],()=>{sW=p[0];draw();})));
 const s=score(),w=wts();
 const val=document.getElementById('s-val'),bar=document.getElementById('s-bar'),

 const done=FIELDS.filter(f=>raw(f)!=null).length;
 flg.innerHTML='<div class="flag">'+REGS.find(r=>r[0]===sR)[2]+'</div>';
 if(s==null){val.innerHTML='0<span class="so">/100</span>';bar.style.width='0%';
  ver.innerHTML='<b>Answer the four</b>'+done+' of '+FIELDS.length+' answered.';brk.innerHTML='';}
 else{const n=Math.round(s),bd=band(n);
  val.innerHTML=n+'<span class="so">/100</span>';bar.style.width=n+'%';
  ver.innerHTML='<b>'+bd[0]+'</b>'+bd[1];
  brk.innerHTML=FIELDS.map(f=>{const r=raw(f);
   return '<div class="brow"><span class="bn">'+f[1]+'</span><span class="bb"><i style="width:'+(r*10)+'%"></i></span><span class="bp">'+r+'/10</span></div>';}).join('')
   +'<div class="brow"><span class="bn" style="color:#9aa1a1">Weighting</span><span class="bp" style="width:auto;color:#9aa1a1">'+w.join(' / ')+'</span></div>';}
 const E=document.getElementById('s-egs');
 const rows=EGS.map(e=>{
   const save=pick,sv=sR;
   pick={brand:e[2],icp:e[3].slice(),proof:e[4].slice(),relation:e[5]};
   const n=Math.round(score());pick=save;sR=sv;return [n,e];}).sort((a,b)=>b[0]-a[0]);
 E.innerHTML='<div class="tr th"><span>Customer archetype</span><span>Fit</span><span>Why</span></div>'
  +rows.map(r=>'<div class="tr rk"><span>'+r[1][0]+'</span><span class="sc">'+r[0]+'</span><span><span class="fx">'+r[1][1]+'.</span> '+r[1][6]+'</span></div>').join('');
 Array.from(E.querySelectorAll('.tr.rk')).forEach((el,i)=>{el.onclick=()=>{
   const e=rows[i][1];sR=e[1];
   pick={brand:e[2],icp:e[3].slice(),proof:e[4].slice(),relation:e[5]};draw();
   document.getElementById('sel').scrollIntoView({behavior:'smooth'});};});
}
function initSel(){draw();}

function b64b(s){const bin=atob(s);const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return b;}
async function mtDecrypt(pw){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64b(MT_BLOB.salt),iterations:MT_BLOB.iterations,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64b(MT_BLOB.iv)},key,b64b(MT_BLOB.ciphertext));
  return new TextDecoder().decode(pt);
}
function mtReveal(h){
  const stage=document.getElementById('mt-stage');
  if(!stage.dataset.filled){stage.innerHTML=h;stage.dataset.filled='1';}
  document.getElementById('mt-gate').style.display='none';
  document.getElementById('mt-doc').classList.add('on');
  if(mtBound)return; mtBound=true;
  if(typeof initSel==='function'){try{initSel();}catch(e){}}
  const links=Array.prototype.slice.call(document.querySelectorAll('nav.side a[data-s]'));
  const secs=links.map(function(a){return document.getElementById(a.dataset.s);}).filter(Boolean);
  function spy(){
    let cur=0;
    secs.forEach(function(s,i){if(s.getBoundingClientRect().top<=140)cur=i;});
    links.forEach(function(a,i){a.classList.toggle('on',i===cur);});
  }
  window.addEventListener('scroll',spy,{passive:true});
  spy();
}
async function mtTry(pw,silent){
  const err=document.getElementById('mt-err');
  try{const h=await mtDecrypt(pw);try{localStorage.setItem(MT_LS,pw);}catch(e){}mtReveal(h);}
  catch(e){if(!silent){err.textContent='wrong password';err.hidden=false;}try{localStorage.removeItem(MT_LS);}catch(e2){}}
}
document.getElementById('mt-form').addEventListener('submit',function(e){e.preventDefault();mtTry(document.getElementById('mt-pw').value,false);});
document.addEventListener('click',function(e){if(e.target&&e.target.id==='mt-lock'){e.preventDefault();try{localStorage.removeItem(MT_LS);}catch(err){}location.reload();}});
(function(){let s=null;try{s=localStorage.getItem(MT_LS);}catch(e){}if(s)mtTry(s,true);else document.getElementById('mt-pw').focus();})();
</script>

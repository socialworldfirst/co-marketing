const REGS=[["UK", "United Kingdom", "ICP 2 marketplace sellers via Amazon, and ICP 1 lifestyle brand owners. Neil owns; no dedicated UK manager yet."], ["EEA", "EU / EEA", "German and Dutch operators, told in local language. Danny sources. Duty and VAT changes are the timing peg."], ["SG", "Singapore", "Sylvia asked for T0/T1 regional traders on FX hedging and SEA corridor collections. Joshua owes the names."], ["MY", "Malaysia", "Three sub-personas do not merge. Gated on KYC and onboarding conversion, not acquisition. Aria proposes the route."], ["VN", "Vietnam", "Shopify, POD and dropshipping: 42% of NFC and roughly 52% of TPV. Off the sourcing corridor, so scores run low here."], ["TH", "Thailand", "Pay to a Chinese bank account is not live. Education only, hold scale until it unlocks. Iris Teo leads."], ["US", "United States, China Desk", "China Desk only. Loud in Chinese, compliance-forward in English. Consent is the whole asset. James first."]], FIELDS=[["brand", "Brand value", "how known is this business", 35, [["Category leader, recognised well beyond its own customers", 10], ["Well known inside its trade or category", 7], ["Known inside a community, association or coach network", 5], ["Known only to its own customers", 2]]], ["icp", "ICP overlap", "what kind of business", 25, [["Operator importer: an SME sourcing from China, with a team", 10], ["Marketplace seller on Amazon, Lazada, Shopee or TikTok Shop (ICP 2)", 9], ["Brand owner, owns the label, lifestyle category (ICP 1)", 9], ["Regional trader or wholesaler, T0 or T1", 8], ["Cross-border seller, collects only, no China sourcing", 6], ["Chinese operator re-flagging into the US (China Desk)", 8], ["Outside our ICP", 2]]], ["proof", "Product proof", "what they actually use with us", 20, [["Several products, including FX hedging or Forwards", 10], ["Pay to China, 1688 or \u8de8\u5883\u5b9d at real volume", 9], ["Multi-currency or marketplace collection at real volume", 8], ["World Card, or a single product", 6], ["Signed but low volume", 3], ["The product we would showcase is not live in their market", 1]]], ["corridor", "Corridor fit", "China and Asia sourcing exposure", 12, [["China sourcing is the core of the business", 10], ["Significant, one of several corridors", 7], ["Minor part of the business", 4], ["None, they only collect", 1]]], ["relation", "Relationship", "where we are with them today", 8, [["Already a public reference, has said yes before", 10], ["Warm, named contact, sales relationship is good", 8], ["Account exists, no marketing relationship", 5], ["Identified, not yet approached", 2]]]], PRESETS=[["brand", "Brand-led", [35, 25, 20, 12, 8]], ["bal", "Balanced", [25, 25, 25, 15, 10]], ["proof", "Proof-led", [20, 25, 35, 12, 8]]], EGS=[["T0/T1 regional trader on FX hedging", "SG", [1, 3, 0, 1, 2], "Sylvia's named SG brief. Best product-proof lane we have: hedging is a story only a real treasury user can tell."], ["Lifestyle brand owner as ambassador", "UK", [1, 2, 2, 1, 1], "Sylvia asked for the most representative big clients. Recognisable name plus a warm relationship is the strongest combination on this model."], ["\u8de8\u5883\u5b9d customer on camera", "MY", [3, 0, 1, 0, 2], "The asset Sylvia asked for. Scores mid because an unknown business carries no brand weight, which is the argument for keeping 1688 alongside them."], ["Marketplace seller found through Amazon", "UK", [2, 1, 2, 1, 2], "ICP 2, the lane Amazon opens. Solid rather than spectacular, and it works as peer proof rather than as a borrowed name."], ["Chinese seller re-flagging into US retail", "US", [2, 5, 2, 0, 2], "Persona C, US only. Corridor fit is maximal, but consent and the compliance rules decide whether it can be filmed at all."], ["Thai marketplace seller", "TH", [3, 1, 5, 1, 2], "Fails on product proof because pay to a Chinese bank account is not live in Thailand. A product date fixes this, better casting does not."], ["VN Shopify seller collecting through Stripe", "VN", [3, 4, 2, 3, 2], "Priority audience commercially, weak co-marketing subject: no name to borrow and the money flows in rather than out to China."]];
let sR='SG', sW='brand', pick={};
function wts(){return PRESETS.find(p=>p[0]===sW)[2];}
function score(p){const w=wts();let t=0;for(let i=0;i<FIELDS.length;i++){const v=p[FIELDS[i][0]];if(v==null)return null;t+=FIELDS[i][4][v][1]/10*w[i];}return t;}
function band(s){if(s>=78)return['Lead with it','Strong enough to carry a flagship film. Commit production.'];
 if(s>=62)return['Build it, close one gap','Worth doing, but one input is dragging. Name the gap in the brief.'];
 if(s>=46)return['Sponsor and a date','Only proceed with a named internal sponsor and a fixed date.'];
 return['Park it','Park, and write down what would have to change.'];}
function pill(l,on,fn){const b=document.createElement('button');b.className='opt'+(on?' on':'');b.type='button';b.textContent=l;b.onclick=fn;return b;}
function draw(){
 const R=document.getElementById('s-reg');R.innerHTML='';
 REGS.forEach(r=>R.appendChild(pill(r[0],sR===r[0],()=>{sR=r[0];draw();})));
 document.getElementById('s-rnote').textContent=REGS.find(r=>r[0]===sR)[2];
 const F=document.getElementById('s-fields');F.innerHTML='';
 FIELDS.forEach(f=>{
  const d=document.createElement('div');d.className='fld'+(f[0]==='brand'?' hi':'');
  d.innerHTML='<div class="fl">'+f[1]+'<span class="fs">'+f[2]+' &middot; '+f[3]+'%</span></div>';
  const o=document.createElement('div');o.className='opts';
  f[4].forEach((opt,i)=>o.appendChild(pill(opt[0],pick[f[0]]===i,()=>{pick[f[0]]=i;draw();})));
  d.appendChild(o);F.appendChild(d);});
 const W=document.getElementById('s-wt');W.innerHTML='';
 PRESETS.forEach(p=>W.appendChild(pill(p[1],sW===p[0],()=>{sW=p[0];draw();})));
 const s=score(pick),w=wts();
 const val=document.getElementById('s-val'),bar=document.getElementById('s-bar'),
       ver=document.getElementById('s-ver'),brk=document.getElementById('s-brk'),flg=document.getElementById('s-flg');
 const answered=FIELDS.filter(f=>pick[f[0]]!=null).length;
 if(s==null){val.innerHTML='0<span class="so">/100</span>';bar.style.width='0%';
  ver.innerHTML='<b>Answer the five</b>'+answered+' of '+FIELDS.length+' answered.';
  brk.innerHTML='';flg.innerHTML='<div class="flag">'+REGS.find(r=>r[0]===sR)[2]+'</div>';}
 else{const n=Math.round(s),bd=band(n);
  val.innerHTML=n+'<span class="so">/100</span>';bar.style.width=n+'%';
  ver.innerHTML='<b>'+bd[0]+'</b>'+bd[1];
  brk.innerHTML=FIELDS.map((f,i)=>{const v=f[4][pick[f[0]]][1];
   return '<div class="brow"><span class="bn">'+f[1]+'</span><span class="bb"><i style="width:'+(v*10)+'%"></i></span><span class="bp">'+v+'/10</span></div>';}).join('')
   +'<div class="brow"><span class="bn" style="color:#9aa1a1">Weighting</span><span class="bp" style="width:auto;color:#9aa1a1">'+w.join(' / ')+'</span></div>';
  flg.innerHTML='<div class="flag">'+REGS.find(r=>r[0]===sR)[2]+'</div>';}
 const E=document.getElementById('s-egs');

function b64b(s){const bin=atob(s);const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return b;}
async function mtDecrypt(pw){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64b(MT_BLOB.salt),iterations:MT_BLOB.iterations,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64b(MT_BLOB.iv)},key,b64b(MT_BLOB.ciphertext));
  return new TextDecoder().decode(pt);
}
function mtReveal(h){
  const stage=document.getElementById('mt-stage');
  if(!stage.dataset.filled){stage.innerHTML=h;stage.dataset.filled='1';}
  document.getElementById('mt-gate').style.display='none';
  document.getElementById('mt-doc').classList.add('on');
  if(mtBound)return; mtBound=true;
  if(typeof initSel==='function'){try{initSel();}catch(e){}}
  const links=Array.prototype.slice.call(document.querySelectorAll('nav.side a[data-s]'));
  const secs=links.map(function(a){return document.getElementById(a.dataset.s);}).filter(Boolean);
  function spy(){
    let cur=0;
    secs.forEach(function(s,i){if(s.getBoundingClientRect().top<=140)cur=i;});
    links.forEach(function(a,i){a.classList.toggle('on',i===cur);});
  }
  window.addEventListener('scroll',spy,{passive:true});
  spy();
}
async function mtTry(pw,silent){
  const err=document.getElementById('mt-err');
  try{const h=await mtDecrypt(pw);try{localStorage.setItem(MT_LS,pw);}catch(e){}mtReveal(h);}
  catch(e){if(!silent){err.textContent='wrong password';err.hidden=false;}try{localStorage.removeItem(MT_LS);}catch(e2){}}
}
document.getElementById('mt-form').addEventListener('submit',function(e){e.preventDefault();mtTry(document.getElementById('mt-pw').value,false);});
document.addEventListener('click',function(e){if(e.target&&e.target.id==='mt-lock'){e.preventDefault();try{localStorage.removeItem(MT_LS);}catch(err){}location.reload();}});

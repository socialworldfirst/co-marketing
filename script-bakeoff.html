async function bkDecrypt(pw){

  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64b(BK_BLOB.iv)},key,b64b(BK_BLOB.ciphertext));
  return JSON.parse(new TextDecoder().decode(pt));
}

  return BK.data.table.map(function(t,i){
    const sc=RK.map(k=>'<span class="c-s '+cls(t.scores[k])+'">'+fmt(t.scores[k])+'</span>').join('');
    return '<div class="mrow'+(i===bkSel?' sel':'')+'" data-i="'+i+'">'
      +'<span class="c-rank">'+(i+1)+'</span>'
      +'<span class="c-name"><span class="cd">'+t.code+'</span><span class="tt">'+esc(t.title)+'</span>'
      +(t.vetoes.length?'<span class="vd" title="veto"></span>':'')+stars(t.top2)+'</span>'
      +sc
      +'<span class="c-avg"><span class="bar"><i style="width:'+Math.round(Math.max(6,Math.min(100,(t.avg-5.5)/2.8*100)))+'%"></i></span><b>'+t.avg.toFixed(1)+'</b></span></div>';
  }).join('');
}
function bkDetail(){
  const t=BK.data.table[bkSel];
  const s=BK.data.scripts[t.code];
  const nm={};BK.data.raters.forEach(r=>nm[r[0]]=r[1]);
  const rows=RK.map(function(k){
    const v=BK.data.verdicts[t.code][k]; if(!v)return '';
    return '<div class="rr"><div class="rh"><span class="rn">'+esc(nm[k])+(v.veto?'<span class="vt">VETO</span>':'')+'</span>'
      +'<span class="rsc '+cls(v.score)+'">'+fmt(v.score)+' / 10</span></div>'
      +'<div class="rv">'+esc(v.verdict)+'</div></div>';
  }).join('');
  return '<div class="dc">'+t.code+' · average '+t.avg.toFixed(1)+(t.top2?' · in '+t.top2+' top-2 list'+(t.top2>1?'s':''):'')+'</div>'
    +'<h2>'+esc(s.title)+'</h2><div class="lg">'+esc(s.logline)+'</div>'
    +rows+'<span class="go" data-code="'+t.code+'">Read the full script →</span>';
}
function bkScript(){
  const s=BK.data.scripts[bkRead];
  const scenes=s.scenes.map(function(sc){
    const lines=(sc.audio||[]).map(a=>'<div class="ln"><div class="who">'+esc(a.who)+'</div><div class="say">'+esc(a.line)+'</div>'
      +(a.direction?'<div class="dir">'+esc(a.direction)+'</div>':'')+'</div>').join('');
    const sup=(sc.supers&&sc.supers.length)?'<div class="sup">'+sc.supers.map(x=>'<span>'+esc(x)+'</span>').join('')+'</div>':'';
    return '<div class="scene"><div class="sh">'+(sc.day?'<span class="sd">'+esc(sc.day)+'</span>':'')
      +'<h3>'+esc(sc.label)+'</h3><span class="st">'+esc(sc.time)+'</span></div>'
      +'<div class="sbody"><div><div class="lbl">Visual</div><div class="vis">'+esc(sc.visual)+'</div>'+sup+'</div>'
      +'<div><div class="lbl">Audio</div>'+(lines||'<div class="dir">No dialogue.</div>')+'</div></div>'
      +(sc.note?'<div class="snote">'+esc(sc.note)+'</div>':'')+'</div>';
  }).join('');
  return '<div class="shd"><h2>'+esc(s.title)+'</h2><span class="rt">'+esc(s.runtime)+' · '+bkRead+'</span></div>'
    +'<div class="slg">'+esc(s.logline)+'</div>'+scenes;
}
function bkPills(){
  return BK.data.table.map(t=>'<button class="pl'+(t.code===bkRead?' on':'')+'" data-code="'+t.code+'"><span class="n">'+t.code+'</span>'+esc(t.title)+'</button>').join('');
}
function bkMoved(){
  const rows=BK.data.table.map(function(t){
    const p=BK.data.pitch[t.code], d=Math.round((t.avg-p)*10)/10;
    return '<div class="r"><span class="cd">'+t.code+'</span><span class="t">'+esc(t.title)+'</span>'
      +'<span class="v">'+p.toFixed(1)+'</span><span class="v">'+t.avg.toFixed(1)+'</span>'
      +'<span class="d '+(d>=0?'d-up':'d-dn')+'">'+(d>=0?'+':'')+d.toFixed(1)+'</span></div>';
  }).join('');
  const notes=BK.data.raterNotes.map(n=>'<div class="nt"><div class="n">'+esc(n[0])+'</div><div class="t">'+esc(n[1])+'</div></div>').join('');
  return '<div class="mv"><div class="r"><span class="rh2"></span><span class="rh2">Script</span><span class="rh2" style="text-align:right">Pitch</span><span class="rh2" style="text-align:right">Script</span><span class="rh2" style="text-align:right">Δ</span></div>'
    +rows+'</div><div class="bh">What each rater said the full scripts changed</div>'+notes;
}
function bkPaint(){
  document.getElementById('bk-rows').innerHTML=bkRows();
  document.getElementById('bk-detail').innerHTML=bkDetail();
}
function bkView(v){
  document.querySelectorAll('.tb').forEach(x=>x.classList.toggle('on',x.dataset.view===v));
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));
  document.getElementById('bk-'+v).classList.add('on');
  window.scrollTo(0,0);
}
function bkReveal(o){
  BK=o;
  const st=document.getElementById('bk-stage');
  if(!st.dataset.filled){st.innerHTML=o.body;st.dataset.filled='1';}
  document.getElementById('bk-gate').style.display='none';
  document.getElementById('bk-doc').classList.add('on');
  if(bkBound)return; bkBound=true;
  bkPaint();
  document.getElementById('bk-pills').innerHTML=bkPills();
  document.getElementById('bk-script').innerHTML=bkScript();
  document.getElementById('bk-moved').innerHTML=bkMoved();
  document.getElementById('bk-rows').addEventListener('click',function(e){
    const r=e.target.closest('.mrow'); if(!r)return;
    bkSel=parseInt(r.dataset.i,10); bkPaint();
  });
  document.getElementById('bk-detail').addEventListener('click',function(e){
    const g=e.target.closest('.go'); if(!g)return;
    bkRead=g.dataset.code;
    document.getElementById('bk-pills').innerHTML=bkPills();
    document.getElementById('bk-script').innerHTML=bkScript();
    bkView('read');
  });
  document.getElementById('bk-pills').addEventListener('click',function(e){
    const p=e.target.closest('.pl'); if(!p)return;
    bkRead=p.dataset.code;
    document.getElementById('bk-pills').innerHTML=bkPills();
    document.getElementById('bk-script').innerHTML=bkScript();
    window.scrollTo(0,0);
  });
  document.querySelectorAll('.tb').forEach(function(b){
    b.addEventListener('click',function(){bkView(b.dataset.view);});
  });
  document.addEventListener('keydown',function(e){
    if(!document.getElementById('bk-rank').classList.contains('on'))return;
    if(e.key==='ArrowDown'){e.preventDefault();bkSel=Math.min(BK.data.table.length-1,bkSel+1);bkPaint();}
    if(e.key==='ArrowUp'){e.preventDefault();bkSel=Math.max(0,bkSel-1);bkPaint();}
  });
}
async function bkTry(pw,silent){
  const err=document.getElementById('bk-err');
  try{const o=await bkDecrypt(pw);try{localStorage.setItem(BK_LS,pw);}catch(e){}bkReveal(o);}
  catch(e){if(!silent){err.textContent='wrong password';err.hidden=false;}try{localStorage.removeItem(BK_LS);}catch(e2){}}
}
document.getElementById('bk-form').addEventListener('submit',function(e){e.preventDefault();bkTry(document.getElementById('bk-pw').value,false);});
document.addEventListener('click',function(e){if(e.target&&e.target.id==='bk-lock'){e.preventDefault();try{localStorage.removeItem(BK_LS);}catch(err){}location.reload();}});
(function(){let s=null;try{s=localStorage.getItem(BK_LS);}catch(e){}if(s)bkTry(s,true);else document.getElementById('bk-pw').focus();})();
</script>
</body></html>

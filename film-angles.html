const FA_D = {"raters": [["op", "Operator", "Target audience. 8-person SG home-goods brand, 1688 + Canton Fair, US$25k/mo ad spend."], ["mc", "Mastercard", "Partner marketing, SEA. Rates brand safety, approval friction, network role."], ["dir", "Director", "Documentary-trained commercial director. Rates filmability, visual spine, edit engine."], ["br", "WF Brand", "Global brand lead. Rates trust, platform stature, unfakeable differentiation."], ["dist", "Distribution", "Head of social distribution. Rates hook, retention, cuttability, boostability."]], "angles": [{"code": "A1", "title": "The Five Jobs", "avg": 7.6, "pitch": "Chaptered explainer. Cold open: five voices each name a payment they made this week. WorldFirst voice explains the card in 30 seconds. Five chapters by use case (ads, 1688 and suppliers, freight, travel, team cards), each led by one client. Mastercard network segment after the travel chapter. Closes on the month-end statement and the cashback beat.", "s": {"op": 8, "mc": 8, "dir": 7, "br": 7, "dist": 8}, "v": {"op": "Chapters mean I can skip straight to the 1688 part, that alone respects my time more than most fintech videos.", "mc": "Modular chapters mean legal can cut one without killing the film, our travel-adjacent network segment is bounded and factual, cleanest 3-week path here.", "dir": "Bulletproof against weak soundbites and chapters map 1:1 to the five verticals, but no momentum: the hero cuts like five stitched mini-ads, not a film.", "br": "Useful and modular, but it is the film Airwallex already makes; chapters organise facts, they do not build a brand.", "dist": "Cleanest cut map here, five born verticals, but chapters are structure not hook, and every chapter break bleeds hero viewers."}}, {"code": "A2", "title": "The Month", "avg": 7.5, "pitch": "Calendar spine, day-stamped. Day 1 an RMB supplier deposit, Day 8 an ad scale-up, Day 15 Canton Fair, Day 22 a new-hire virtual card issued in seconds, Day 30 the statement drops with cashback. Cast interwoven chronologically. Teaches the rhythm of a cross-border month.", "s": {"op": 6, "mc": 8, "dir": 9, "br": 8, "dist": 6.5}, "v": {"op": "Nice rhythm, but it is a story I must sit through, I cannot jump to the bit I need, and I already live this calendar.", "mc": "Strong engines-of-growth narrative, the mid-month road appearance is contextual and contained, day-stamps are WorldFirst claims, not ours.", "dir": "Time is the narrator: day-stamp supers carry story, scenes are activity-led so non-actors just do their jobs, and cross-cutting four businesses hides any weak bite.", "br": "The day-stamped spine proves habitual, embedded use, the closest thing here to operating-system positioning, though the format is copyable.", "dist": "Day-stamps give momentum, but four businesses on one timeline confuses mid-watch and a \"Day 14\" cold open dies contextless on Shorts."}}, {"code": "A7", "title": "Operator FAQ", "avg": 7.5, "pitch": "Built from the real questions sellers ask about business cards. Can I pay 1688 by card? Is cashback really uncapped? What about trade fairs? How do I stop team overspend? The best-placed cast member answers each. Each vertical is one question. Extensible into a standing series.", "s": {"op": 9, "mc": 7, "dir": 6, "br": 7, "dist": 8.5}, "v": {"op": "These are the exact questions I type into Google at 11pm, answer them straight and I will watch every one and forward two.", "mc": "Factual and modular, verticals cut cleanly, but \"is cashback really uncapped?\" makes the film claims-forward and puts us one edit away from substantiation questions.", "dir": "Best vertical engine here, real questions lower the performance bar, but there is no hero in it: 3.5 minutes of FAQ is a webinar.", "br": "Best series engine on the list, weakest hero; utility compounds trust but there is no spine for a flagship.", "dist": "Question hooks are native currency on every feed, each Q and A is a born vertical plus an extensible series; the hero is the weakness, compilation not film."}}, {"code": "A3", "title": "The Statement", "avg": 7.2, "pitch": "Opens on a real month-end card statement on screen. Each line item cuts to the person and the scene behind it. Finale is the cashback line, the only line that gives money back. WorldFirst voice closes: now go read yours.", "s": {"op": 7, "mc": 5, "dir": 7, "br": 8, "dist": 9}, "v": {"op": "Real statement lines are the most honest thing a payments brand can show me, but if the numbers look staged I close it in 5 seconds.", "mc": "The hero prop is a compliance document, every visible line item becomes a reviewable claim, and statement artwork drags our brand identity into design review.", "dir": "The line items drive the cut and the cashback finale is earned, but the spine is a screen: cold-opening on paperwork, and a mocked-up statement chips at documentary credibility.", "br": "Receipts-first transparency is a trust move rivals cannot match without matching numbers, and \"now go read yours\" is confident, implicitly comparative, never punchy.", "dist": "Real-statement voyeurism is a proven finance hook, each line item is an open loop paying off at the cashback line, and every line pre-cuts to a vertical whose super is the swappable market number."}}, {"code": "A8", "title": "Three Days in Guangzhou", "avg": 6.8, "veto": "Mastercard", "pitch": "Location film during Canton Fair season. The card works the whole trip: booth deposit, hotel tap, taxi, a late-night ad top-up from the hotel room, an instant virtual card for a local sourcing agent. Mastercard spokesperson walks the fair floor talking acceptance. Strongest visuals, narrower to importers, timing bound to the fair.", "s": {"op": 7, "mc": 3, "dir": 8, "br": 9, "dist": 7}, "v": {"op": "This is my actual fair life and I would watch it before fair season, but it is travel content, mostly for importers who fly.", "mc": "Our exec on a China fair floor talking 200-plus-country acceptance opens regional sensitivities I will not touch, and shoot logistics alone blow the 3-week window.", "dir": "Best pure filmmaking: real stakes, one city, three days, visuals everywhere. But it hangs on one founder performing, fair permits, immovable dates, and it orphans two of the five jobs.", "br": "The one film competitors cannot shoot: real fair floor, real supplier, the card working inside the corridor we actually own. Access is the brand.", "dist": "Strongest visuals, vlog grammar retains, but all five verticals skew importer and location film is the costliest to re-version."}}, {"code": "A9", "title": "From One Card to Twenty-Five", "avg": 6.6, "pitch": "Scale story. The spine is growth: a solo founder\u2019s first card through to a 10-person team\u2019s card system. Finance lead is the lead voice, the other clients are stages of the journey. Positions the card as a system, not a perk.", "s": {"op": 6, "mc": 7, "dir": 7, "br": 7, "dist": 6}, "v": {"op": "Team card control is a real headache at 8 staff, but \"growth journey\" framing is brand-film cosplay.", "mc": "Scale-with-controls maps neatly to connect and protect, very safe, but the network role feels bolted on rather than earned.", "dir": "Real arc, and finance leads are usually your most articulate cast, but borrowing four companies as stages of one journey muddies whose story it is.", "br": "Card-as-infrastructure is genuine platform positioning and LinkedIn-native, but visually thin, and every fintech claims it scales with you.", "dist": "Slow-open growth arc reads as testimonial ad and the middle does not chunk into standalone cuts; team-controls angle saves it on LinkedIn only."}}, {"code": "A6", "title": "Follow the Dollar", "avg": 6.2, "pitch": "One dollar earned on Amazon travels through the business: into ads, a 1688 deposit, freight, a hotel tap in Guangzhou, a team card, and comes back as cashback. A simple motion graphic connects the live-action scenes. Clients narrate the leg they own. Mastercard owns the rails leg.", "s": {"op": 5, "mc": 9, "dir": 5, "br": 5, "dist": 7}, "v": {"op": "Pretty concept, but what I learn is that money moves through a business, which I already knew, nothing usable tomorrow.", "mc": "Rails is literally what we are, a discrete scripted motion-graphic leg is the easiest asset I could walk through franchise review, zero comparative risk, clean connect-small-businesses fit.", "dir": "The motion-graphic dollar is a narrator in a costume: heavy post, ad drift, scripted legs from non-actors, and the literal dollar journey invites legal nitpicks.", "br": "Slick motion graphics is Airwallex and Wise home turf, and giving Mastercard the rails leg hands them the infrastructure story; we shrink to issuer.", "dist": "Best hero watch-time shape, one continuous thread with a payoff loop, but the stitch dies in the cut: verticals orphan the device, motion graphics raise re-version cost."}}, {"code": "A4", "title": "The Switch", "avg": 5.5, "veto": "Mastercard", "pitch": "Before and after audit. Each client tells what their old setup cost them: a 3% FX markup, a card declined at a supplier, a founder\u2019s personal card paying company ads, zero spend visibility. Then the after. Strongest problem-first conversion energy, most negative tone.", "s": {"op": 6, "mc": 2, "dir": 5, "br": 6, "dist": 8.5}, "v": {"op": "The founder-paying-company-ads-on-a-personal-card pain is literally me, but before/after testimonial energy smells like an ad, and I am allergic.", "mc": "Banks are our issuing customers, I cannot put a Mastercard spokesperson in a film built on bank-bashing, comparative pricing, and a declined card that viewers may read as ours.", "dir": "The before half is unshootable: staged failure with non-actors or interview wallpaper, and real SMEs rarely articulate old pain crisply on camera.", "br": "A conquest demand asset, not brand; it defines us by competitors\u2019 pricing and reads challenger, not platform.", "dist": "Problem-first opens hardest and boosts cleanest, but four repeated audits sag by client three and aggressive cost claims add co-brand compliance drag."}}, {"code": "A10", "title": "The Card That Pays You Back", "avg": 5.0, "pitch": "Cashback-led. Hook: this business card paid my ad bill back. Prove it across the five jobs, biggest-month cashback super at the end. Most thumb-stopping hook, most ad-like, rates vary by market.", "s": {"op": 5, "mc": 5, "dir": 4, "br": 4, "dist": 7}, "v": {"op": "The hook stops my thumb, then I feel sold to, and cashback-first attracts points chasers, not operators.", "mc": "A cashback-led open reads as a rewards promo, and our presence beside a \"paid my ad bill back\" testimonial looks like we co-signed the claim.", "dir": "That is an ad: claim-first kills documentary tone in ten seconds, and the hook is a number the supers-only rule will not let anyone say.", "br": "Leads with the bribe; rate-shopper framing that commoditises the brand and accrues zero trust.", "dist": "Best raw hook, worst shape: spike then cliff after the reveal, and five cashback-led cuts repeat themselves. A hook line, not a system."}}, {"code": "A5", "title": "Six Chairs, Same Questions", "avg": 4.7, "pitch": "Pure interview grid. All six people answer the same five questions. What did you pay for this week? What surprised you? What broke before? Show me your last transaction. Advice for someone starting? Rapid intercut montage, structure emerges in the edit.", "s": {"op": 4, "mc": 4, "dir": 5, "br": 5, "dist": 5.5}, "v": {"op": "Structure emerges in the edit means nobody decided what I am supposed to learn, it is a montage of vibes.", "mc": "The intercut grid scatters our spokesperson across the full runtime, I cannot bound the 15% or excerpt her segment for approval, and same-questions framing drifts her into product claims by adjacency.", "dir": "Cheapest and edit-safe, but 100% soundbite-dependent with zero visual spine: shoot the grid as coverage insurance inside another concept, never as the film.", "br" const FA_LS = 'bc_pw';
let faBound=false, faSel=0;
function b64b(s){const bin=atob(s);const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return b;}
async function faDecrypt(pw){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64b(FA_BLOB.salt),iterations:FA_BLOB.iterations,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64b(FA_BLOB.iv)},key,b64b(FA_BLOB.ciphertext));
  return new TextDecoder().decode(pt);
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function cls(n){return n>=8?'s-hi':(n>=6?'s-mid':'s-lo');}
function fmt(n){return Number.isInteger(n)?n:n.toFixed(1);}

function faRows(){
  const R=FA_D.raters.map(r=>r[0]);
  return FA_D.angles.map(function(a,i){
    const sc=R.map(k=>'<span class="c-s '+cls(a.s[k])+'">'+fmt(a.s[k])+'</span>').join('');
    return '<div class="mrow'+(i===faSel?' sel':'')+'" data-i="'+i+'">'
      +'<span class="c-rank">'+(i+1)+'</span>'
      +'<span class="c-name"><span class="cd">'+a.code+'</span><span class="tt">'+esc(a.title)+'</span>'
      +(a.veto?'<span class="vd" title="Veto: '+esc(a.veto)+'"></span>':'')+'</span>'
      +sc
      +'<span class="c-avg"><span class="bar"><i style="width:'+Math.round(Math.max(6,Math.min(100,(a.avg-4.2)/3.6*100)))+'%"></i></span><b>'+a.avg.toFixed(1)+'</b></span>'
      +'</div>';
  }).join('');
}
function faDetail(){
  const a=FA_D.angles[faSel];
  const rows=FA_D.raters.map(function(r){
    const k=r[0];
    return '<div class="rr"><div class="rh"><span class="rn">'+esc(r[1])+'</span>'
      +'<span class="rsc '+cls(a.s[k])+'">'+fmt(a.s[k])+' / 10</span></div>'
      +'<div class="rv">'+esc(a.v[k])+'</div></div>';
  }).join('');
  return '<div class="dc">'+a.code+' · average '+a.avg.toFixed(1)+'</div>'
    +'<h2>'+esc(a.title)+'</h2><div class="pitch">'+esc(a.pitch)+'</div>'
    +(a.veto?'<div class="vetobar">'+esc(a.veto)+' veto. This rating outranks the average, the angle cannot run as a co-branded piece in this form.</div>':'')
    +'<div class="rl">'+rows+'</div>';
}
function faBuild(){
  const rec=FA_D.recipe.map(r=>'<div class="r"><span class="k">'+esc(r[0])+'</span><span class="src">'+esc(r[1])+'</span><span class="t">'+esc(r[2])+'</span></div>').join('');
  const drop=FA_D.dropped.map(d=>'<div class="dr"><b>'+d[0]+' '+esc(d[1])+'</b><span>'+esc(d[2])+'</span></div>').join('');
  const nm={};FA_D.raters.forEach(r=>nm[r[0]]=r[1]);
  const fx=FA_D.fixes.map(f=>'<div class="fxr"><div class="n">'+esc(nm[f[0]])+'</div><div class="t">'+esc(f[1])+'</div></div>').join('');
  return '<div class="bwrap"><div>'
    +'<div class="bh">The synthesis</div>'
    +'<p class="blead">No single angle wins. The two highest creative scores are both vetoed or structurally weak on their own, so the film is assembled from four of them. Working title: The Month.</p>'
    +'<div class="rec">'+rec+'</div>'
    +'<div class="dropped"><div class="bh" style="margin-top:6px">Dropped</div>'+drop+'</div>'
    +'</div><div><div class="bh">Each rater\u2019s one fix</div><div class="fx">'+fx+'</div></div></div>';
}
function faPaint(){
  document.getElementById('fa-rows').innerHTML=faRows();
  document.getElementById('fa-detail').innerHTML=faDetail();
}
function faReveal(h){
  const stage=document.getElementById('fa-stage');
  if(!stage.dataset.filled){stage.innerHTML=h;stage.dataset.filled='1';}
  document.getElementById('fa-gate').style.display='none';
  document.getElementById('fa-doc').classList.add('on');
  if(faBound)return; faBound=true;
  faPaint();
  document.getElementById('fa-build').innerHTML=faBuild();
  document.getElementById('fa-rows').addEventListener('click',function(e){
    const r=e.target.closest('.mrow'); if(!r)return;
    faSel=parseInt(r.dataset.i,10); faPaint();
  });
  document.querySelectorAll('.tb').forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('.tb').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
      document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
      document.getElementById('fa-'+b.dataset.view).classList.add('on');
    });
  });
  document.addEventListener('keydown',function(e){
    if(!document.getElementById('fa-board').classList.contains('on'))return;
    if(e.key==='ArrowDown'){e.preventDefault();faSel=Math.min(FA_D.angles.length-1,faSel+1);faPaint();}
    if(e.key==='ArrowUp'){e.preventDefault();faSel=Math.max(0,faSel-1);faPaint();}
  });
}
async function faTry(pw,silent){
  const err=document.getElementById('fa-err');
  try{const h=await faDecrypt(pw);try{localStorage.setItem(FA_LS,pw);}catch(e){}faReveal(h);}
  catch(e){if(!silent){err.textContent='wrong password';err.hidden=false;}try{localStorage.removeItem(FA_LS);}catch(e2){}}
}
document.getElementById('fa-form').addEventListener('submit',function(e){e.preventDefault();faTry(document.getElementById('fa-pw').value,false);});
document.addEventListener('click',function(e){if(e.target&&e.target.id==='fa-lock'){e.preventDefault();try{localStorage.removeItem(FA_LS);}catch(err){}location.reload();}});
(function(){let s=null;try{s=localStorage.getItem(FA_LS);}catch(e){}if(s)faTry(s,true);else document.getElementById('fa-pw').focus();})();
</script>

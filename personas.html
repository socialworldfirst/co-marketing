function b64b(s){const bin=atob(s);const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return b;}
async function mtDecrypt(pw){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64b(MT_BLOB.salt),iterations:MT_BLOB.iterations,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64b(MT_BLOB.iv)},key,b64b(MT_BLOB.ciphertext));
  return new TextDecoder().decode(pt);
}

var REG = {
  SG:{hint:'Casting T0/T1 regional trading houses. The client carries the film alone, no partner logo needed.',
      type:['trader','wholesale'],sell:['b2b'],hero:['fx','corridor'],src:['cn_direct','mixed','none']},
  MY:{hint:'Casting the full source-and-sell loop: buy on 1688, sell on TikTok Shop. Serves the locked 1688 partnership.',
      type:['ecom','wholesale'],sell:['tts','dtc'],hero:['kjb','p2c'],src:['1688']},
  UK:{hint:'Two lanes. ICP 2 marketplace sellers via Amazon, and ICP 1 lifestyle brand owners as ambassadors.',
      type:['ecom','brand'],sell:['amazon','dtc','retail'],hero:['p2c','fx','mkt'],src:['1688','cn_direct']},
  US:{hint:'Casting Walmart Marketplace sellers, possibly carrying a China Desk story. Schedule to the H2 Walmart Summit.',
      type:['ecom','wholesale'],sell:['walmart'],hero:['p2c','mkt'],src:['1688','cn_direct']}
};
var PNAME = {fx:'FX Forwards',corridor:'SEA corridor collections',kjb:'跨境宝',p2c:'Pay to China',mkt:'Marketplace collection',wa:'World Account',card:'World Card'};
var S = {region:'SG',type:null,sell:[],source:null,platform:[],product:[],brand:'2',publish:'3',story:'2'};

function initSel(){
  var box=document.getElementById('fit'); if(!box)return;
  box.addEventListener('click',function(e){
    var b=e.target.closest('.opt'); if(!b)return;
    var wrap=b.parentElement, g=wrap.dataset.g, single=wrap.dataset.single==='1', v=b.dataset.v;
    if(single){ wrap.querySelectorAll('.opt').forEach(function(x){x.classList.remove('on');}); b.classList.add('on'); S[g]=v; }
    else { b.classList.toggle('on'); S[g]=Array.prototype.slice.call(wrap.querySelectorAll('.opt.on')).map(function(x){return x.dataset.v;}); }
    render();
  });
  render();
}
function markTargets(){
  var r=REG[S.region];
  document.querySelectorAll('#fit .opts').forEach(function(w){
    var g=w.dataset.g;
    w.querySelectorAll('.opt').forEach(function(o){
      var t=false, v=o.dataset.v;
      if(g==='type') t=r.type.indexOf(v)>=0;
      else if(g==='sell') t=r.sell.indexOf(v)>=0;
      else if(g==='product') t=r.hero.indexOf(v)>=0;
      else if(g==='source') t=r.src.indexOf(v)>=0;
      o.classList.toggle('tgt',t);
    });
  });
}
function render(){
  var r=REG[S.region];
  markTargets();
  document.getElementById('regHint').textContent=r.hint;
  document.getElementById('prodHint').textContent='Hero products for '+S.region+': '+r.hero.map(function(h){return PNAME[h];}).join(', ')+'. These carry the most weight.';

  // brand value, 30
  var brandPts=({'4':30,'3':23,'2':14,'1':7})[S.brand];
  // co-publishing, 20
  var pubPts=({'4':20,'3':15,'2':7,'1':3})[S.publish];
  // regional fit, 18 = type 10 + sell 5 + source 3
  var fit=0;
  if(S.type) fit += r.type.indexOf(S.type)>=0 ? 10 : (S.type==='services'?0:4);
  var sellHit=S.sell.filter(function(x){return r.sell.indexOf(x)>=0;}).length;
  fit += sellHit>0 ? 5 : (S.sell.length?2:0);
  if(S.source) fit += r.src.indexOf(S.source)>=0 ? 3 : 1;
  // product proof, 14
  var heroHit=S.product.filter(function(x){return r.hero.indexOf(x)>=0;}).length;
  var other=S.product.length-heroHit;
  var prod=Math.min(14, (heroHit/r.hero.length)*11 + Math.min(other,3));
  // story, 10
  var storyPts=({'3':10,'2':6,'1':2})[S.story];
  // platform reach, 8
  var plat=Math.min(8, S.platform.length*2.2);

  var parts=[['Brand value',brandPts,30],['Will they co-publish',pubPts,20],['Regional fit',fit,18],['Product proof',prod,14],['Story strength',storyPts,10],['Platform reach',plat,8]];
  var total=Math.round(parts.reduce(function(a,p){return a+p[1];},0));

  document.getElementById('scoreNum').textContent=total;
  document.getElementById('meterFill').style.width=total+'%';

  var v;
  var wontPost = (S.publish==='2'||S.publish==='1');
  if(wontPost){
    v = total>=58
      ? {t:'Client story, not co-marketing',d:'Scores well, but they will not put it on their own channel. That is the line. Film it as peer proof if it is worth it, do not cost it as a flagship co-marketing piece.'}
      : {t:'Not yet',d:'They will not co-publish and the rest is not strong enough to carry it anyway. Go back for better answers or park it.'};
  }
  else if(total>=75) v={t:'Flagship candidate',d:'Strong enough to carry a hero film. Get the co-publishing commitment in writing, then brief production.'};
  else if(total>=58) v={t:'Shortlist',d:'Worth a call. Usually one dimension is soft, check the breakdown before you commit a crew.'};
  else if(total>=40) v={t:'Client story, not co-marketing',d:'Real value as peer proof, but do not cost or schedule this as a flagship co-marketing film.'};
  else v={t:'Not yet',d:'Missing too much of what this pillar needs. Park it or go back for better answers.'};
  document.getElementById('verdict').innerHTML='<b>'+v.t+'</b>'+v.d;

  document.getElementById('breakdown').innerHTML=parts.map(function(p){
    var pc=Math.round(p[1]/p[2]*100);
    return '<div class="brow"><span class="bn">'+p[0]+'</span><span class="bb"><i style="width:'+pc+'%"></i></span><span class="bp">'+Math.round(p[1])+'/'+p[2]+'</span></div>';
  }).join('');

  var f=[];
  if(S.publish==='2'||S.publish==='1') f.push('They will not post it. That makes this a client story by definition, whatever the score says.');
  if(heroHit===0) f.push('No hero product for '+S.region+' selected. The film would not prove anything specific to this region.');
  if(S.brand==='1'&&total>=58) f.push('Unknown name scoring well on everything else: a client story framing will be stronger here than a co-marketing one.');
  if(S.brand==='4'&&(S.publish==='2'||S.publish==='1')) f.push('A household name that will not co-publish is the most expensive miss available. Push on distribution before anything else.');
  if(S.region==='MY'&&S.source==='1688'&&S.sell.indexOf('tts')>=0) f.push('This is the full source-and-sell loop in one business, the structure Sylvia asked for. Prioritise it.');
  if(S.region==='US'&&S.sell.indexOf('walmart')<0) f.push('No Walmart presence. The US play is built around Walmart and the H2 Summit.');
  if(S.region==='SG'&&S.product.indexOf('fx')<0) f.push('No FX Forwards. SG was cast specifically for hedging behaviour.');
  if(S.type==='services') f.push('Services businesses sit outside all four regional personas.');
  document.getElementById('flags').innerHTML=f.map(function(x){return '<div class="flag">'+x+'</div>';}).join('');
}

function mtReveal(h){
  const stage=document.getElementById('mt-stage');
  if(!stage.dataset.filled){stage.innerHTML=h;stage.dataset.filled='1';}
  document.getElementById('mt-gate').style.display='none';
  document.getElementById('mt-doc').classList.add('on');
  if(mtBound)return; mtBound=true;
  try{initSel();}catch(e){}
  const links=Array.prototype.slice.call(document.querySelectorAll('nav.side a[data-s]'));
  const secs=links.map(function(a){return document.getElementById(a.dataset.s);}).filter(Boolean);
  function spy(){
    let cur=0;
    secs.forEach(function(s,i){if(s.getBoundingClientRect().top<=140)cur=i;});
    links.forEach(function(a,i){a.classList.toggle('on',i===cur);});
  }
  window.addEventListener('scroll',spy,{passive:true});
  spy();
}
async function mtTry(pw,silent){
  const err=document.getElementById('mt-err');
  try{const h=await mtDecrypt(pw);try{localStorage.setItem(MT_LS,pw);}catch(e){}mtReveal(h);}
  catch(e){if(!silent){err.textContent='wrong password';err.hidden=false;}try{localStorage.removeItem(MT_LS);}catch(e2){}}
}

function b64b(s){const bin=atob(s);const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return b;}
async function nsDecrypt(pw){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64b(NS_BLOB.salt),iterations:NS_BLOB.iterations,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64b(NS_BLOB.iv)},key,b64b(NS_BLOB.ciphertext));
  return JSON.parse(new TextDecoder().decode(pt));
}
function nsReveal(o){
  const stage=document.getElementById('ns-stage');
  if(!stage.dataset.filled){stage.innerHTML=o.body;stage.dataset.filled='1';}
  document.getElementById('ns-gate').style.display='none';
  document.getElementById('ns-doc').classList.add('on');
  if(nsBound)return; nsBound=true;
  document.querySelectorAll('.ntabs .tb').forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('.ntabs .tb').forEach(function(x){x.classList.toggle('on',x===b);});
      document.querySelectorAll('.nview').forEach(function(v){v.classList.remove('on');});
      document.getElementById('ns-'+b.dataset.v).classList.add('on');
    });
  });
}
async function nsTry(pw,silent){
  const err=document.getElementById('ns-err');
  try{const o=await nsDecrypt(pw);try{localStorage.setItem(NS_LS,pw);}catch(e){}nsReveal(o);}
  catch(e){if(!silent){err.textContent='wrong password';err.hidden=false;}try{localStorage.removeItem(NS_LS);}catch(e2){}}
}
document.getElementById('ns-form').addEventListener('submit',function(e){e.preventDefault();nsTry(document.getElementById('ns-pw').value,false);});
document.addEventListener('click',function(e){if(e.target&&e.target.id==='ns-lock'){e.preventDefault();try{localStorage.removeItem(NS_LS);}catch(err){}location.reload();}});
(function(){let s=null;try{s=localStorage.getItem(NS_LS);}catch(e){}if(s)nsTry(s,true);else document.getElementById('ns-pw').focus();})();
</script>
</body></html>

function b64b(s){const bin=atob(s);const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return b;}
async function scDecrypt(pw){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64b(SC_BLOB.salt),iterations:SC_BLOB.iterations,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64b(SC_BLOB.iv)},key,b64b(SC_BLOB.ciphertext));
  return new TextDecoder().decode(pt);
}

function scReveal(h){
  const st=document.getElementById('sc-stage');
  if(!st.dataset.filled){st.innerHTML=h;st.dataset.filled='1';}
  document.getElementById('sc-gate').style.display='none';
  document.getElementById('sc-doc').classList.add('on');
  if(scBound)return; scBound=true; scPaint();
  document.querySelectorAll('.tb').forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('.tb').forEach(x=>x.classList.remove('on'));b.classList.add('on');

      document.getElementById('sc-'+b.dataset.view).classList.add('on');
      window.scrollTo(0,0);
    });
  });
}

  catch(e){if(!silent){err.textContent='wrong password';err.hidden=false;}try{localStorage.removeItem(SC_LS);}catch(e2){}}
}
